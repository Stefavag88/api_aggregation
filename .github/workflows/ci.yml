name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore ApiAggregation.slnx
      - run: dotnet build ApiAggregation.slnx -c Release --no-restore
      - run: dotnet test tests/ApiAggregation.UnitTests/ApiAggregation.UnitTests.csproj -c Release --no-build
